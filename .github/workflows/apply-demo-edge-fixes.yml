name: Apply demo edge fixes

on:
  push:
    branches:
      - feature/demo-hardening-2026-11-03
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/demo-hardening-2026-11-03
      - name: Apply narrow fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          ledger = Path('src/luckyjet_signal/demo_ledger.py')
          replace_once(
              ledger,
              '''        if not multiplier.is_finite() or multiplier < 1:\n            return None\n\n        if not self.active:\n''',
              '''        if not multiplier.is_finite() or multiplier < 1:\n            return None\n\n        if not self.active and self.balance_cents < MINIMUM_STAKE_CENTS:\n            self.low_streak = 0\n            return None\n\n        if not self.active:\n''',
              'pause below minimum stake',
          )

          gate = Path('luckyjet_password_gate.py')
          replace_once(
              gate,
              '''        lines += ["", f"Причина завершения: {reason}",\n                  f"Всего поставлено: {format_dollars(entry.get('total_stake_cents', 0) or 0)}"]\n''',
              '''        if outcome == "recovered":\n            lines.append("")\n            lines.append("Потраченные средства возвращены.")\n        lines += ["", f"Причина завершения: {reason}",\n                  f"Всего поставлено: {format_dollars(entry.get('total_stake_cents', 0) or 0)}"]\n''',
              'recovered compatibility text',
          )
          PY
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/luckyjet_signal/demo_ledger.py luckyjet_password_gate.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: pause exhausted demo and preserve recovered summary"
            git push origin HEAD:feature/demo-hardening-2026-11-03
          fi
