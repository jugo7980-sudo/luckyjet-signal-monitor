name: Apply step label fix

on:
  push:
    branches:
      - fix/live-history-refresh
    paths:
      - .github/workflows/apply-step-label-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-history-refresh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Change cycle label to step label
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("luckyjet_password_gate.py")
          text = path.read_text()
          old = 'f"{round_count} цик. · {stamp} · {result}"'
          new = 'f"{round_count} шаг. · {stamp} · {result}"'
          if old not in text:
              raise SystemExit("target cycle label not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run full test suite
        run: pytest -q
      - name: Commit tested fix
        run: |
          git config user.name "jugo7980-sudo"
          git config user.email "jugo7980@gmail.com"
          git add luckyjet_password_gate.py
          git commit -m "Use step label in demo history buttons"
          git push origin HEAD:fix/live-history-refresh
