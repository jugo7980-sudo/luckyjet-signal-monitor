name: Keep Render bot awake

on:
  schedule:
    # Every 5 minutes, deliberately offset from :00 to reduce GitHub Actions cron delays.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-alive.yml"

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 90 \
            --retry 3 \
            --retry-delay 5 \
            "https://luckyjet-signal-monitor.onrender.com/")"
          printf '%s\n' "$response"
          grep -q '"status":"ok"' <<< "$response"
