name: Bot tests
on:
  push:
    branches: [main, fix/site-account-static-menu]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt 'pytest<10' 'fakeredis[lua]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
