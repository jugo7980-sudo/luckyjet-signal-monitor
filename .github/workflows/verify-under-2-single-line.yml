name: Verify single under-2 display line

on:
  push:
    branches:
      - fix/coef-under-2-single-line

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coef-under-2-single-line
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Remove duplicate under-2 line
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('luckyjet_password_gate.py')
          text=p.read_text()
          old='''        else:\n            text+="\\n<2x: нет данных"\n        text+=f"\\n<2x: {summary.get('lt2', 0)}"\n'''
          new='''        else:\n            text+="\\n<2x: нет данных"\n'''
          if old not in text:
              raise SystemExit('duplicate under-2 display line not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Run full test suite
        run: pytest -q
      - name: Commit tested source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luckyjet_password_gate.py
          git commit -m 'fix: show one under-2 coefficient line'
          git push origin HEAD:fix/coef-under-2-single-line
